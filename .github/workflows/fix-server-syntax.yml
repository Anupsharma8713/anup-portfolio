name: Fix resume server syntax
on:
  push:
    paths:
      - '.github/workflows/fix-server-syntax.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix and validate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('server.js')
          s=p.read_text()
          s=s.replace('path.join(PUBLIC,"admin.html"),"utf8\'))','path.join(PUBLIC,"admin.html"),"utf8"))')
          p.write_text(s)
          PY
          node --check server.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.js
          git commit -m 'Fix server syntax' || exit 0
          git push
