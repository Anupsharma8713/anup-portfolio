<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portfolio Admin</title><style>body{margin:0;background:#08080b;color:#fff;font-family:Inter,Arial}.wrap{width:min(1050px,92%);margin:auto}.top{height:70px;border-bottom:1px solid #292530;display:flex;align-items:center}.panel{margin:25px 0;padding:24px;background:#111116;border:1px solid #292530;border-radius:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}label{display:block;color:#aaa;font-size:12px;margin:0 0 7px}input,select,textarea{box-sizing:border-box;width:100%;padding:12px;background:#09090c;border:1px solid #332e39;color:#fff;border-radius:8px}textarea{min-height:90px}.full{grid-column:1/-1}.btn{padding:12px 17px;background:#19161f;color:#fff;border:1px solid #49385a;border-radius:8px;cursor:pointer}.primary{background:#7d2ce5}.item{padding:14px;border:1px solid #292530;border-radius:10px;margin-top:10px;display:flex;justify-content:space-between;gap:15px}.muted{color:#888;font-size:13px}.hidden{display:none}.toast{position:fixed;right:20px;bottom:20px;background:#17131e;border:1px solid #69419a;padding:13px 16px;border-radius:10px;display:none}.toast.show{display:block}.progress-wrap{display:none;margin-top:18px}.progress-wrap.show{display:block}.progress-top{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:#bbb;margin-bottom:8px}.progress-bar{height:10px;background:#24202a;border-radius:999px;overflow:hidden;border:1px solid #332d3b}.progress-fill{height:100%;width:0;background:linear-gradient(90deg,#7d2ce5,#b56cff);transition:width .15s ease}.progress-meta{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:#777;margin-top:7px}.uploading{opacity:.7;pointer-events:none}@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.item{display:block}.progress-meta,.progress-top{font-size:12px}}</style></head><body><header class="top"><div class="wrap"><b>ANUP<span style="color:#b56cff">.</span> ADMIN</b></div></header><main class="wrap"><section id="loginPanel" class="panel" style="max-width:420px;margin:80px auto"><h2>Admin Login</h2><input id="pw" type="password" placeholder="Password"><br><br><button class="btn primary" onclick="adminLogin()">LOGIN</button></section><section id="app" class="hidden"><div class="panel"><h1>Portfolio Manager</h1><p class="muted">Upload karo aur Publish karte hi project main website par live ho jayega.</p></div><div class="panel" id="videoPanel"><h2>Add Video</h2><div class="grid"><div><label>Title</label><input id="vt"></div><div><label>Category</label><select id="vc"><option>Social Media Reel</option><option>YouTube Video</option><option>Podcast</option><option>Motion Graphics</option><option>CGI Ads</option></select></div><div><label>Software</label><input id="vtools"></div><div><label>Duration</label><input id="vd"></div><div class="full"><label>Description</label><textarea id="vdesc"></textarea></div><div><label>Video</label><input id="vf" type="file" accept="video/*"></div><div><label>Thumbnail</label><input id="vi" type="file" accept="image/*"></div></div><br><button id="videoBtn" class="btn primary" onclick="add('video')">UPLOAD & PUBLISH VIDEO</button><div id="videoProgress" class="progress-wrap"><div class="progress-top"><span id="progressLabel">Uploading video...</span><strong id="progressPercent">0%</strong></div><div class="progress-bar"><div id="progressFill" class="progress-fill"></div></div><div class="progress-meta"><span id="progressLoaded">0 MB / 0 MB</span><span id="progressStatus">Preparing...</span></div></div></div><div class="panel" id="modelPanel"><h2>Add 3D Model</h2><div class="grid"><div><label>Title</label><input id="mt"></div><div><label>Category</label><select id="mc"><option>Product Visualization</option><option>3D Asset</option><option>Exhibition / Event</option><option>CGI Advertisement</option></select></div><div><label>Software</label><input id="mtools"></div><div><label>Format</label><select id="mf"><option>FBX</option><option>GLB</option><option>GLTF</option></select></div><div class="full"><label>Description</label><textarea id="mdesc"></textarea></div><div><label>3D Model</label><input id="mm" type="file" accept=".fbx,.glb,.gltf"></div><div><label>Thumbnail</label><input id="mi" type="file" accept="image/*"></div></div><br><button id="modelBtn" class="btn primary" onclick="add('3d')">UPLOAD & PUBLISH 3D MODEL</button><div id="modelProgress" class="progress-wrap"><div class="progress-top"><span id="modelProgressLabel">Uploading model...</span><strong id="modelProgressPercent">0%</strong></div><div class="progress-bar"><div id="modelProgressFill" class="progress-fill"></div></div><div class="progress-meta"><span id="modelProgressLoaded">0 MB / 0 MB</span><span id="modelProgressStatus">Preparing...</span></div></div></div><div class="panel"><h2>Published Projects</h2><div id="list"></div></div></section></main><div id="toast" class="toast"></div><script>let token=localStorage.getItem('anup_token');const toast=x=>{const t=document.getElementById('toast');t.textContent=x;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)};async function adminLogin(){const password=document.getElementById('pw').value;const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password})});let d={};try{d=await r.json()}catch{}if(!r.ok){localStorage.removeItem('anup_token');token='';return toast(d.error||'Login failed')}token=d.token;localStorage.setItem('anup_token',token);show()}function show(){document.getElementById('loginPanel').style.display='none';document.getElementById('app').classList.remove('hidden');load()}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function mb(n){return (n/1024/1024).toFixed(n/1024/1024<10?2:1)}function progressUI(type,loaded,total,status){const p=type==='video'?{wrap:videoProgress,fill:progressFill,percent:progressPercent,loaded:progressLoaded,status:progressStatus,label:progressLabel}:{wrap:modelProgress,fill:modelProgressFill,percent:modelProgressPercent,loaded:modelProgressLoaded,status:modelProgressStatus,label:modelProgressLabel};const pct=total?Math.min(100,Math.round(loaded/total*100)):0;p.wrap.classList.add('show');p.fill.style.width=pct+'%';p.percent.textContent=pct+'%';p.loaded.textContent=mb(loaded)+' MB / '+mb(total)+' MB';p.status.textContent=status||'Uploading...';p.label.textContent=type==='video'?'Uploading video...':'Uploading model...'}function resetProgress(type){const p=type==='video'?{wrap:videoProgress,fill:progressFill,percent:progressPercent,loaded:progressLoaded,status:progressStatus,label:progressLabel}:{wrap:modelProgress,fill:modelProgressFill,percent:modelProgressPercent,loaded:modelProgressLoaded,status:modelProgressStatus,label:modelProgressLabel};p.wrap.classList.remove('show');p.fill.style.width='0%';p.percent.textContent='0%';p.loaded.textContent='0 MB / 0 MB';p.status.textContent='Preparing...'}function uploadWithProgress(type,form){return new Promise((resolve,reject)=>{const xhr=new XMLHttpRequest();xhr.open('POST','/api/projects');xhr.setRequestHeader('Authorization','Bearer '+token);xhr.upload.addEventListener('progress',e=>{if(e.lengthComputable)progressUI(type,e.loaded,e.total,'Uploading...')});xhr.upload.addEventListener('loadend',()=>{progressUI(type,form.get(type==='video'?'video':'model')?.size||0,form.get(type==='video'?'video':'model')?.size||0,'Processing & publishing...')});xhr.onreadystatechange=()=>{if(xhr.readyState!==4)return;let d={};try{d=JSON.parse(xhr.responseText||'{}')}catch{}if(xhr.status>=200&&xhr.status<300)resolve(d);else reject(new Error(d.error||'Upload failed'))};xhr.onerror=()=>reject(new Error('Network error during upload'));xhr.ontimeout=()=>reject(new Error('Upload timed out'));xhr.timeout=0;xhr.send(form)})}async function add(type){const f=new FormData();if(type==='video'){f.append('type',type);f.append('title',vt.value);f.append('category',vc.value);f.append('tools',vtools.value);f.append('duration',vd.value);f.append('description',vdesc.value);if(!vf.files[0])return toast('Video file required');f.append('video',vf.files[0]);if(vi.files[0])f.append('thumbnail',vi.files[0])}else{f.append('type',type);f.append('title',mt.value);f.append('category',mc.value);f.append('tools',mtools.value);f.append('format',mf.value);f.append('description',mdesc.value);if(!mm.files[0])return toast('3D model file required');f.append('model',mm.files[0]);if(mi.files[0])f.append('thumbnail',mi.files[0])}const btn=type==='video'?videoBtn:modelBtn;const panel=type==='video'?videoPanel:modelPanel;btn.disabled=true;panel.classList.add('uploading');resetProgress(type);progressUI(type,0,(f.get(type==='video'?'video':'model')||{}).size||0,'Starting upload...');try{await uploadWithProgress(type,f);progressUI(type,f.get(type==='video'?'video':'model').size,f.get(type==='video'?'video':'model').size,'Complete');toast('Published successfully');document.querySelectorAll('#app input,#app textarea').forEach(x=>{if(x.type==='file')x.value='';else x.value=''});await load();setTimeout(()=>resetProgress(type),1200)}catch(e){progressUI(type,0,(f.get(type==='video'?'video':'model')||{}).size||0,'Failed');toast(e.message||'Upload failed')}finally{btn.disabled=false;panel.classList.remove('uploading')}}async function load(){const r=await fetch('/api/projects');const p=await r.json();list.innerHTML=p.map(x=>`<div class="item"><div><b>${esc(x.title)}</b><div class="muted">${esc(x.type.toUpperCase())} · ${esc(x.category)} · ${esc(x.tools||'')}</div></div><button class="btn" onclick="del('${esc(x.id)}')">Delete</button></div>`).join('')||'<p class="muted">No projects yet.</p>'}async function del(id){if(!confirm('Delete project?'))return;const r=await fetch('/api/projects/'+id,{method:'DELETE',headers:{Authorization:'Bearer '+token}});if(r.ok){toast('Deleted');load()}else toast('Delete failed')}if(token)show();</script></body></html>
