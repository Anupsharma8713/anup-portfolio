<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portfolio Admin</title><style>body{margin:0;background:#08080b;color:#fff;font-family:Inter,Arial}.wrap{width:min(1050px,92%);margin:auto}.top{height:70px;border-bottom:1px solid #292530;display:flex;align-items:center}.panel{margin:25px 0;padding:24px;background:#111116;border:1px solid #292530;border-radius:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}label{display:block;color:#aaa;font-size:12px;margin:0 0 7px}input,select,textarea{box-sizing:border-box;width:100%;padding:12px;background:#09090c;border:1px solid #332e39;color:#fff;border-radius:8px}textarea{min-height:90px}.full{grid-column:1/-1}.btn{padding:12px 17px;background:#19161f;color:#fff;border:1px solid #49385a;border-radius:8px;cursor:pointer}.primary{background:#7d2ce5}.item{padding:14px;border:1px solid #292530;border-radius:10px;margin-top:10px;display:flex;justify-content:space-between;gap:15px}.muted{color:#888;font-size:13px}.hidden{display:none}.toast{position:fixed;right:20px;bottom:20px;background:#17131e;border:1px solid #69419a;padding:13px 16px;border-radius:10px;display:none;z-index:10}.toast.show{display:block}.progress-wrap{display:none;margin-top:18px}.progress-wrap.show{display:block}.progress-top{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:#bbb;margin-bottom:8px}.progress-bar{height:10px;background:#24202a;border-radius:999px;overflow:hidden;border:1px solid #332d3b}.progress-fill{height:100%;width:0;background:linear-gradient(90deg,#7d2ce5,#b56cff);transition:width .15s ease}.progress-meta{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:#777;margin-top:7px}.uploading{opacity:.65;pointer-events:none}@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.item{display:block}}</style></head><body><header class="top"><div class="wrap"><b>ANUP<span style="color:#b56cff">.</span> ADMIN</b></div></header><main class="wrap"><section id="loginPanel" class="panel" style="max-width:420px;margin:80px auto"><h2>Admin Login</h2><input id="pw" type="password" placeholder="Password"><br><br><button class="btn primary" onclick="adminLogin()">LOGIN</button></section><section id="app" class="hidden"><div class="panel"><h1>Portfolio Manager</h1><p class="muted">Upload karo aur Publish karte hi project main website par live ho jayega.</p></div><div class="panel" id="videoPanel"><h2>Add Video</h2><div class="grid"><div><label>Title</label><input id="vt"></div><div><label>Category</label><select id="vc"><option>Social Media Reel</option><option>YouTube Video</option><option>Podcast</option><option>Motion Graphics</option><option>CGI Ads</option></select></div><div><label>Software</label><input id="vtools"></div><div><label>Duration</label><input id="vd"></div><div class="full"><label>Description</label><textarea id="vdesc"></textarea></div><div><label>Video</label><input id="vf" type="file" accept="video/*"></div><div><label>Thumbnail</label><input id="vi" type="file" accept="image/*"></div></div><br><button id="videoBtn" class="btn primary" onclick="add('video')">UPLOAD &amp; PUBLISH VIDEO</button><div id="videoProgress" class="progress-wrap"><div class="progress-top"><span id="progressLabel">Uploading video...</span><strong id="progressPercent">0%</strong></div><div class="progress-bar"><div id="progressFill" class="progress-fill"></div></div><div class="progress-meta"><span id="progressLoaded">0 MB / 0 MB</span><span id="progressStatus">Preparing...</span></div></div></div><div class="panel" id="modelPanel"><h2>Add 3D Model</h2><div class="grid"><div><label>Title</label><input id="mt"></div><div><label>Category</label><select id="mc"><option>Product Visualization</option><option>3D Asset</option><option>Exhibition / Event</option><option>CGI Advertisement</option></select></div><div><label>Software</label><input id="mtools"></div><div><label>Format</label><select id="mf"><option>FBX</option><option>GLB</option><option>GLTF</option></select></div><div class="full"><label>Description</label><textarea id="mdesc"></textarea></div><div><label>3D Model</label><input id="mm" type="file" accept=".fbx,.glb,.gltf"></div><div><label>Thumbnail</label><input id="mi" type="file" accept="image/*"></div></div><br><button id="modelBtn" class="btn primary" onclick="add('3d')">UPLOAD &amp; PUBLISH 3D MODEL</button><div id="modelProgress" class="progress-wrap"><div class="progress-top"><span id="modelProgressLabel">Uploading model...</span><strong id="modelProgressPercent">0%</strong></div><div class="progress-bar"><div id="modelProgressFill" class="progress-fill"></div></div><div class="progress-meta"><span id="modelProgressLoaded">0 MB / 0 MB</span><span id="modelProgressStatus">Preparing...</span></div></div></div><div class="panel"><h2>Published Projects</h2><div id="list"></div></div></section></main><div id="toast" class="toast"></div><script>let token=localStorage.getItem('anup_token');const $=id=>document.getElementById(id);const toast=x=>{const t=$('toast');t.textContent=x;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000)};function mb(n){return (n/1024/1024).toFixed(n/1024/1024<10?2:1)}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}async function adminLogin(){const password=$('pw').value;const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password})});let d={};try{d=await r.json()}catch{}if(!r.ok){localStorage.removeItem('anup_token');token='';return toast(d.error||'Login failed')}token=d.token;localStorage.setItem('anup_token',token);show()}function show(){$('loginPanel').style.display='none';$('app').classList.remove('hidden');load()}function setProgress(type,loaded,total,status,label){const p=type==='video'?{wrap:$('videoProgress'),fill:$('progressFill'),percent:$('progressPercent'),loaded:$('progressLoaded'),status:$('progressStatus'),label:$('progressLabel')}:{wrap:$('modelProgress'),fill:$('modelProgressFill'),percent:$('modelProgressPercent'),loaded:$('modelProgressLoaded'),status:$('modelProgressStatus'),label:$('modelProgressLabel')};const pct=total?Math.min(100,Math.round(loaded/total*100)):0;p.wrap.classList.add('show');p.fill.style.width=pct+'%';p.percent.textContent=pct+'%';p.loaded.textContent=mb(loaded)+' MB / '+mb(total)+' MB';p.status.textContent=status||'Uploading...';p.label.textContent=label||(type==='video'?'Uploading video...':'Uploading model...')}function hideProgress(type){$(type==='video'?'videoProgress':'modelProgress').classList.remove('show')}function setBusy(type,busy){const panel=$(type==='video'?'videoPanel':'modelPanel');const btn=$(type==='video'?'videoBtn':'modelBtn');panel.classList.toggle('uploading',busy);btn.disabled=busy}async function getUploadUrl(type,file){const r=await fetch('/api/upload-url',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({type,filename:file.name})});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||'Could not prepare upload');return d}function directUpload(type,file,onProgress){return getUploadUrl(type,file).then(info=>new Promise((resolve,reject)=>{const xhr=new XMLHttpRequest();xhr.open('PUT',info.signedUrl,true);xhr.upload.onprogress=e=>{if(e.lengthComputable)onProgress(e.loaded,e.total,'Uploading...')};xhr.onload=()=>{if(xhr.status>=200&&xhr.status<300)resolve(info);else reject(new Error('Supabase upload failed ('+xhr.status+')'))};xhr.onerror=()=>reject(new Error('Network error during upload'));xhr.onabort=()=>reject(new Error('Upload cancelled'));const form=new FormData();form.append('cacheControl','3600');form.append('',file);xhr.send(form)}))}async function publishMeta(type,data){const r=await fetch('/api/projects',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify(data)});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||'Could not publish project');return d}async function add(type){const video=type==='video';const file=$(video?'vf':'mm').files[0];const thumb=$(video?'vi':'mi').files[0];if(!file)return toast(video?'Please choose a video first':'Please choose a 3D model first');const title=$(video?'vt':'mt').value.trim();if(!title)return toast('Title required');setBusy(type,true);try{setProgress(type,0,file.size,'Preparing upload...',video?'Uploading video...':'Uploading model...');const uploaded=await directUpload(type,file,(loaded,total,status)=>setProgress(type,loaded,total,status,video?'Uploading video...':'Uploading model...'));setProgress(type,file.size,file.size,'Upload complete','Processing & publishing...');let thumbnailUrl=null;if(thumb){setProgress(type,0,thumb.size,'Uploading thumbnail...','Uploading thumbnail...');const ti=await directUpload('thumbnail',thumb,(loaded,total)=>setProgress(type,loaded,total,'Uploading thumbnail...','Uploading thumbnail...'));thumbnailUrl=ti.publicUrl}setProgress(type,file.size,file.size,'Saving project...','Publishing...');const data=video?{type:'video',title,category:$('vc').value,tools:$('vtools').value,duration:$('vd').value,description:$('vdesc').value,video_url:uploaded.publicUrl,thumbnail_url:thumbnailUrl}:{type:'3d',title,category:$('mc').value,tools:$('mtools').value,format:$('mf').value,description:$('mdesc').value,model_url:uploaded.publicUrl,thumbnail_url:thumbnailUrl};await publishMeta(type,data);setProgress(type,file.size,file.size,'Published successfully','Published ✓');toast('Published successfully');document.querySelectorAll('#'+(video?'videoPanel':'modelPanel')+' input,#'+(video?'videoPanel':'modelPanel')+' textarea').forEach(x=>{if(x.type==='file')x.value='';else x.value=''});load();setTimeout(()=>hideProgress(type),1500)}catch(e){setProgress(type,0,file.size,'Failed',video?'Upload failed':'Upload failed');toast(e.message||'Upload failed')}finally{setBusy(type,false)}}async function load(){const r=await fetch('/api/projects');let p=[];try{p=await r.json()}catch{}$('list').innerHTML=p.map(x=>`<div class="item"><div><b>${esc(x.title)}</b><div class="muted">${esc(String(x.type||'').toUpperCase())} · ${esc(x.category)} · ${esc(x.tools||'')}</div></div><button class="btn" onclick="del('${esc(x.id)}')">Delete</button></div>`).join('')||'<p class="muted">No projects yet.</p>'}async function del(id){if(!confirm('Delete project?'))return;const r=await fetch('/api/projects/'+encodeURIComponent(id),{method:'DELETE',headers:{Authorization:'Bearer '+token}});if(r.ok){toast('Deleted');load()}else{let d={};try{d=await r.json()}catch{}toast(d.error||'Delete failed')}}if(token)show();</script></body></html>
